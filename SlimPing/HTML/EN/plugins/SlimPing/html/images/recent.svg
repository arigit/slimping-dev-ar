<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="recentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
        </linearGradient>
        <style>
            .bg { fill: url(#recentGrad); }
            .page { fill: white; }
            .title { fill: #B8860B; }
            .text1 { fill: #DDD; }
            .text2 { fill: #DDD; }
            .add-btn { fill: #FF6B6B; }
            .add-text { fill: white; }
        </style>
    </defs>
    <rect width="100" height="100" rx="22" class="bg"/>
    <rect x="30" y="25" width="40" height="50" rx="6" class="page"/>
    <rect x="35" y="30" width="30" height="3" rx="1.5" class="title"/>
    <rect x="35" y="37" width="20" height="2" rx="1" class="text1"/>
    <rect x="35" y="42" width="25" height="2" rx="1" class="text2"/>
    <circle cx="65" cy="30" r="8" class="add-btn"/>
    <text x="65" y="35" text-anchor="middle" class="add-text" font-size="10" font-weight="bold">+</text>
</svg>