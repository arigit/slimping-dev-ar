<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Podcasts alternative">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <style>
      .bg { fill: url(#gradPrimary); }
      .fg { fill: #ffffff; }
      .accent { fill: #0ea5e9; }
      .strokeW { stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>
  <rect width="100" height="100" rx="20" class="bg"/>
  <!-- headphones -->
  <path d="M30 52 a20 20 0 0 1 40 0" class="strokeW"/>
  <rect x="24" y="52" width="12" height="20" rx="5" class="fg"/>
  <rect x="64" y="52" width="12" height="20" rx="5" class="fg"/>
  <!-- centre play -->
  <path d="M46 48 L60 56 L46 64 Z" class="accent"/>
</svg>
