<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
        </linearGradient>
        <style>
            .bg { fill: url(#timeGrad); }
            .clock { fill: white; }
            .hour-hand { stroke: #B8860B; fill: none; }
            .minute-hand { stroke: #B8860B; fill: none; }
            .center { fill: #B8860B; }
        </style>
    </defs>
    <rect width="100" height="100" rx="22" class="bg"/>
    <circle cx="50" cy="50" r="20" class="clock"/>
    <line x1="50" y1="50" x2="50" y2="35" class="hour-hand" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="62" y2="50" class="minute-hand" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="2" class="center"/>
</svg>