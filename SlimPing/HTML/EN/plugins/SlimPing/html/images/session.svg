<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="sessionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
        </linearGradient>
        <style>
            .bg { fill: url(#sessionGrad); }
            .window { fill: white; }
            .progress { fill: white; }
            .player1 { fill: white; }
            .player2 { fill: white; }
            .play-line { stroke: white; fill: none; }
        </style>
    </defs>
    <rect width="100" height="100" rx="22" class="bg"/>
    <rect x="30" y="30" width="40" height="25" rx="4" class="window"/>
    <rect x="25" y="40" width="50" height="4" rx="2" class="progress"/>
    <circle cx="40" cy="65" r="6" class="player1"/>
    <circle cx="60" cy="65" r="6" class="player2"/>
    <line x1="46" y1="65" x2="54" y2="65" class="play-line" stroke-width="2"/>
</svg>
