<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
        </linearGradient>
        <style>
            .bg { fill: url(#infoGrad); }
            .circle-main { fill: white; }
            .dot { fill: #1976d2; }
            .bar { fill: #1976d2; }
        </style>
    </defs>
    <rect width="100" height="100" rx="22" class="bg"/>
    <circle cx="50" cy="50" r="22" class="circle-main"/>
    <circle cx="50" cy="40" r="3" class="dot"/>
    <rect x="47" y="48" width="6" height="16" rx="3" class="bar"/>
</svg>