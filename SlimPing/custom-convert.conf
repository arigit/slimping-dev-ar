# SlimPing custom convert.conf - applied only to SlimPing virtual players
# (model='slimping' or model='slimping-<client>').  System rules (matching
# * *) are the automatic fallback when a rule here cannot satisfy the request.
#
# Every rule mirrors the system convert.conf equivalent with three differences:
#   1. slimping * instead of * * (only matches SlimPing virtual players)
#   2. -q 2 instead of -q $QUALITY$ (LAME's documented "same quality as
#      -q 0, much faster" preset; -q 0 was measured at ~10x realtime
#      encode speed on reference hardware, ~2.5x slower than -q 2)
#   3. CBR (--cbr -b %B) instead of system ABR (-V $QUALITY$)
#
# Why CBR:
# When LAME streams ABR output to stdout it cannot write a usable Xing/LAME
# info header (no seek-back), so native audio engines (AVPlayer on iOS,
# ExoPlayer on Android) fall back to reading the first audio frame's bitrate
# and dividing Content-Length by it to compute duration.  ABR frames vary
# from 64 to 320 kbps so the first-frame bitrate is essentially random per
# track - duration shown by the client can be way off in either direction.
#
# CBR makes every frame the same bitrate, so:
#   - AVPlayer/ExoPlayer read any frame and get the correct rate
#   - Duration computation is exact
#   - Seek positions land precisely
#   - Our canonical SIZE (bitrate * duration / 8) is exact, not estimated
#
# Trade-off: CBR is slightly less bit-efficient than VBR.  Audibly
# indistinguishable at 192+ kbps for nearly all listeners; minor quality
# concern only at very low bitrates (< 96 kbps).
#
# Per-client rules can override these by using a more specific model string
# (e.g. slimping-symfonium) — see StreamingClient::model() in VirtualPlayer.pm.
#
# The mp3->mp3 cap-down re-encode path (MP3 bitrate limiting, Spotty caps)
# is covered by the 'mp3 mp3 slimping *' rule below.  The system passthrough
# (mp3 mp3 * *) lacks the B capability and is correctly rejected when
# bitrate limiting is requested.

# --- Lossless sources ----------------------------------------------------------

flc mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}T:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=--resample %D}E:{NOSTART=I}
	[flac] -dc --totally-silent $START$ $END$ --force-raw-format --endian=little --sign=signed -- $FILE$ | [sox] -q -t raw --endian little --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ - -t raw -c 2 - | [lame] --silent -r --little-endian --signed --bitwidth $SAMPLESIZE$ -s $SAMPLERATE$ -q 2 $RESAMPLE$ $BITRATE$ - -

wav mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[lame] --silent -q 2 $RESAMPLE$ $BITRATE$ $FILE$ -

aif mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[lame] --silent -q 2 $RESAMPLE$ $BITRATE$ $FILE$ -

alc mp3 slimping *
	# FB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}T:{START=-j %s}U:{END=-e %u}
	[faad] -q -w -f 1 $START$ $END$ $FILE$ | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

alcx mp3 slimping *
	# FB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}T:{START=-j %s}U:{END=-e %u}
	[faad] -q -w -f 1 $START$ $END$ $FILE$ | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

ape mp3 slimping *
	# FB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[mac] $FILE$ - -d | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

wvp mp3 slimping *
	# FB:{BITRATE=--cbr -b %B}T:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=--resample %D}
	[wvunpack] $FILE$ -wq $START$ $END$ -o - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

# --- DSD sources (DSDPlayer plugin required) -----------------------------------

# DSD->MP3 pipeline: dsdplay decodes DSD->PCM, its built-in soxr resampler
# downsamples from the native DSD rate to 44.1 kHz, and encodes as FLAC.
# SoX converts the container to WAV, and LAME encodes as CBR MP3.
#
# LMS's convert.conf parser does not recognise 'dsf'/'dff' as built-in audio
# source types and silently drops rules for them.  The rules below are
# superseded by dynamic commandTable registrations in VirtualPlayer.pm.
# They are kept here for documentation and future-proofing if LMS adds
# native DSD source-type support.

# ============================================================================
# NOT ACTIVE — The DSD rules below are NOT processed by LMS's convert.conf
# parser because it does not recognise 'dsf'/'dff' as built-in audio source
# types and silently drops rules for them.  DSD transcoding is handled by
# VirtualPlayer.pm via ExternalProcess (dsdplay | flac | lame).
#
# These rules are kept as documentation of the intended pipeline structure.
# If LMS adds native DSD source-type support in a future release, uncomment
# these rules and the dynamic commandTable registrations in VirtualPlayer.pm
# can be removed in favour of native pipeline execution.
# ============================================================================
# dsf mp3 slimping *
# 	# IFB:{BITRATE=--cbr -b %B}
# 	[dsdplay] -r 44100 $FILE$ | [sox] -q -t flac - -t wav - | [lame] --silent -q 2 $BITRATE$ - -
#
# dff mp3 slimping *
# 	# IFB:{BITRATE=--cbr -b %B}
# 	[dsdplay] -r 44100 $FILE$ | [sox] -q -t flac - -t wav - | [lame] --silent -q 2 $BITRATE$ - -

# --- Lossy sources (remote tracks, re-encoding, bitrate capping) --------------

ogg mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[sox] -q -t ogg $FILE$ -t wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

ops mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[sox] -q -t opus $FILE$ -t wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

mp4 mp3 slimping *
	# FB:{BITRATE=--cbr -b %B}T:{START=-j %s}U:{END=-e %u}
	[faad] -q -w -f 1 $START$ $END$ $FILE$ | [lame] --silent -q 2 $BITRATE$ - -

mp4x mp3 slimping *
	# FB:{BITRATE=--cbr -b %B}T:{START=-j %s}U:{END=-e %u}
	[faad] -q -w -f 1 $START$ $END$ $FILE$ | [lame] --silent -q 2 $BITRATE$ - -

aac mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}
	[faad] -q -w -f 1 $FILE$ | [lame] --silent -q 2 $BITRATE$ - -

wma mp3 slimping *
	# F:{PATH=%f}R:{PATH=%F}B:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[ffmpeg] -loglevel quiet -i $PATH$ -f wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

wmal mp3 slimping *
	# F:{PATH=%f}R:{PATH=%F}B:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[ffmpeg] -loglevel quiet -i $PATH$ -f wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

wmap mp3 slimping *
	# F:{PATH=%f}R:{PATH=%F}B:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[ffmpeg] -loglevel quiet -i $PATH$ -f wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

mpc mp3 slimping *
	# IRB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[mppdec] --silent --prev --gain 3 - - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

# --- Streaming-service sources ------------------------------------------------

# Spotty (Spotify): the Spotty plugin's stock 'spt mp3 * *' rule uses --abr.
# We override with --cbr so SlimPing's canonical SIZE math (bitrate * duration / 8)
# matches actual delivered bytes, eliminating the byte-count mismatch that drives
# client retry storms (and consequent Spotify account-flagging risk).
#
# --bitrate 320 in the spotty command line is Spotify's source-side quality cap
# (Premium tier OGG Vorbis), independent of LAME's output bitrate.
#
# The T capability is preserved — Spotty's --start-position supports source-side
# seek into the Spotify track, which combined with CBR gives exact byte<->time
# mapping for the seekable-transcode path.

spt mp3 slimping *
	# RB:{BITRATE=--cbr -b %B}T:{START=--start-position %s}
	[spotty] -n Squeezebox -c "$CACHE$" --single-track $URL$ --bitrate 320 --disable-discovery --disable-audio-cache $START$ | [lame] -r --silent -q 2 $BITRATE$ - -

# --- MP3-source cap-down re-encode --------------------------------------------

# The system 'mp3 mp3 transcode *' rule uses --abr.  For our SlimPing virtual
# players the slimping-* profile is checked before transcode-* in LMS's
# getConvertCommand2 (Slim/Player/TranscodingHelper.pm:371-385) because the
# 'transcode' clienttype is only prepended when a protocol handler returns
# forceTranscode=true, which no installed plugin does in practice.

# Adding this rule does NOT change system-wide behaviour — it matches only
# when player->model() returns 'slimping' (our virtual players, after the
# _clientModel default-to-slimping change).  Real Squeezebox hardware,
# other plugins' players, web client, and stream.mp3 all keep using the
# system mp3 mp3 transcode * rule with --abr.

# Affects: TIDAL / Deezer / Qobuz / YouTube emitting MP3 above our cap,
# and any local MP3 library track above the user's cap.

mp3 mp3 slimping *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[lame] --silent -q 2 $BITRATE$ $RESAMPLE$ --mp3input $FILE$ -

# --- Share rules (slimping-share) -----------------------------------------------
# Same conversions as the generic slimping rules but with -q 5 (fast LAME preset)
# to reduce CPU per listener.  Share streams may have concurrent visitors so
# encoding throughput matters more than transparency. It is also designed as a 
# quick share capability for users and not a pure audio pipline.

# All other parameters (seek, resample, bitrate floor) are unchanged from the
# parent slimping rules.

# --- Lossless sources ----------------------------------------------------------

flc mp3 slimping-share *
	# IFB:{BITRATE=--cbr -b %B}T:{START=--skip=%t}U:{END=--until=%v}D:{RESAMPLE=--resample %D}E:{NOSTART=I}
	[flac] -dc --totally-silent $START$ $END$ --force-raw-format --endian=little --sign=signed -- $FILE$ | [sox] -q -t raw --endian little --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ - -t raw -c 2 - | [lame] --silent -r --little-endian --signed --bitwidth $SAMPLESIZE$ -s $SAMPLERATE$ -q 5 $RESAMPLE$ $BITRATE$ - -

