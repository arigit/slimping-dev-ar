# --- Radio rules (slimping-radio) ----------------------------------------------
# Optimised for live internet radio streams. They are actually any playable LMS
# favourites mapped to 'Subsonic Radio Stations' but they are delivered as live
# streams. Optionally with ICY metadata support.

# Three differences from the generic slimping rules:
#   1. No seek parameters (START/END) — live streams are never seeked, so we
#      skip the overhead of computing skip/until offsets on every transcode.
#   2. -q 2 instead of -q 2 — near-transparent quality with measurably lower CPU.
#   3. CBR is kept even though live streams have no duration/seek requirements,
#      for consistency with all other slimping rules and because pool delivery
#      already amortises bandwidth across listeners.

# NOTE: lossless source rules MUST be listed here explicitly.  LMS's
# TranscodingHelper does not do prefix-based fallback — if flc mp3 slimping-radio
# is not found it skips straight to the system flc mp3 * * rule (ABR/VBR), not
# to flc mp3 slimping *.

# --- Lossless radio sources ----------------------------------------------------

flc mp3 slimping-radio *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}E:{NOSTART=I}
	[flac] -dc --totally-silent --force-raw-format --endian=little --sign=signed -- $FILE$ | [sox] -q -t raw --endian little --encoding signed-integer -b $SAMPLESIZE$ -r $SAMPLERATE$ -c $CHANNELS$ - -t raw -c 2 - | [lame] --silent -r --little-endian --signed --bitwidth $SAMPLESIZE$ -s $SAMPLERATE$ -q 2 $RESAMPLE$ $BITRATE$ - -

# --- Lossy radio sources -------------------------------------------------------

ogg mp3 slimping-radio *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[sox] -q -t ogg $FILE$ -t wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

ops mp3 slimping-radio *
	# IFB:{BITRATE=--cbr -b %B}D:{RESAMPLE=--resample %D}
	[sox] -q -t opus $FILE$ -t wav - | [lame] --silent -q 2 $RESAMPLE$ $BITRATE$ - -

mp4 mp3 slimping-radio *
	# FB:{BITRATE=--cbr -b %B}
	[faad] -q -w -f 1 $FILE$ | [lame] --silent -q 2 $BITRATE$ - -

mp4x mp3 slimping-radio *
	# FB:{BITRATE=--cbr -b %B}
	[faad] -q -w -f 1 $FILE$ | [lame] --silent -q 2 $BITRATE$ - -

aac mp3 slimping-radio *
